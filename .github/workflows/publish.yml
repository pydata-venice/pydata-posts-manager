# Calls the reusable workflow from bilardi/github-actions-publish to publish posts.
name: Publish posts
on:
  workflow_dispatch:
jobs:
  publish:
    uses: bilardi/github-actions-publish/.github/workflows/publish.yml@v0.2.0
    secrets:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
